<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ships ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>💗</text></svg>" />
  <style>
    :root {
      --bg:            #fff5f9;
      --surface:       #ffffff;
      --surface-2:     #fef2f7;
      --border:        #f5c6df;
      --divider:       #fde8f3;
      --text:          #1a0a12;
      --text-muted:    #7b4063;
      --text-faint:    #c090aa;
      --primary:       #e91e8c;
      --primary-dim:   rgba(233,30,140,0.10);
      --primary-light: #fde8f3;
      --accent:        #ff79b0;
      --danger:        #e53535;
      --shadow:        0 2px 16px rgba(233,30,140,0.10);
      --shadow-lg:     0 8px 36px rgba(233,30,140,0.18);
      --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
      --t:160ms cubic-bezier(0.16,1,0.3,1);
      --font:'Inter','Segoe UI',system-ui,sans-serif;
      --font-display:'Playfair Display',Georgia,serif;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-font-smoothing:antialiased;}
    body{
      font-family:var(--font);font-size:14px;line-height:1.5;
      color:var(--text);background:var(--bg);min-height:100dvh;
      background-image:
        radial-gradient(ellipse 800px 500px at 0% 0%,#ffd6ec 0%,transparent 60%),
        radial-gradient(ellipse 600px 400px at 100% 100%,#ffe8f3 0%,transparent 55%);
    }
    img{display:block;max-width:100%;}
    button{cursor:pointer;font:inherit;}
    :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm);}
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-track{background:var(--bg);}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

    /* ===== HEADER ===== */
    .app-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 24px;border-bottom:1px solid var(--border);
      background:rgba(255,245,249,0.88);backdrop-filter:blur(12px);
      position:sticky;top:0;z-index:200;height:56px;
    }
    .header-brand{
      font-family:var(--font-display);font-size:1.2rem;font-style:italic;
      color:var(--primary);display:flex;align-items:center;gap:8px;
    }
    .header-actions{display:flex;align-items:center;gap:8px;}

    /* ===== BUTTONS ===== */
    .btn{
      padding:6px 13px;border-radius:var(--r-md);border:1.5px solid var(--border);
      background:var(--surface);color:var(--text-muted);font:inherit;
      font-size:0.81rem;font-weight:500;cursor:pointer;white-space:nowrap;
      transition:background var(--t),border-color var(--t),color var(--t);
      text-decoration:none;display:inline-flex;align-items:center;
    }
    .btn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
    .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn-primary:hover{background:#d0187c;border-color:#d0187c;color:#fff;}
    .btn-danger{color:var(--danger);border-color:rgba(229,53,53,0.3);}
    .btn-danger:hover{background:rgba(229,53,53,0.08);border-color:var(--danger);color:var(--danger);}
    .btn-icon{
      width:32px;height:32px;padding:0;border-radius:var(--r-md);
      border:1.5px solid var(--border);background:var(--surface);
      color:var(--text-faint);display:flex;align-items:center;justify-content:center;
      transition:background var(--t),border-color var(--t),color var(--t);
    }
    .btn-icon:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
    .btn-icon.active{background:var(--primary);border-color:var(--primary);color:#fff;}

    /* ===== PAGE ===== */
    .page{max-width:960px;margin:0 auto;padding:28px 20px 60px;}

    /* ===== HERO ===== */
    .hero{text-align:center;padding:32px 16px 28px;margin-bottom:36px;}
    .hero-title{
      font-family:var(--font-display);font-size:3rem;font-style:italic;
      color:var(--primary);line-height:1;margin-bottom:8px;
    }
    .hero-sub{font-size:0.95rem;color:var(--text-muted);}

    /* ===== SECTION ===== */
    .section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
    .section-title{font-size:0.7rem;font-weight:700;text-transform:uppercase;
      letter-spacing:0.12em;color:var(--primary);white-space:nowrap;}
    .section-header::after{content:'';flex:1;height:1px;background:var(--border);}

    /* ===== SHIPS GRID ===== */
    .ships-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
      gap:16px;
    }

    /* ===== SHIP CARD ===== */
    .ship-card{
      position:relative;border-radius:var(--r-lg);overflow:hidden;
      background:var(--surface-2);border:1.5px solid var(--border);
      box-shadow:var(--shadow);aspect-ratio:3/4;
      transition:box-shadow var(--t),border-color var(--t);
    }
    .ship-card:hover{box-shadow:var(--shadow-lg);border-color:var(--primary);}
    .edit-mode .ship-card{cursor:pointer;}

    /* split (two photos) */
    .ship-split{display:flex;height:100%;position:relative;}
    .ship-half{flex:1;overflow:hidden;position:relative;}
    .ship-half img{width:100%;height:100%;object-fit:cover;display:block;}
    .ship-half-placeholder{
      width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      font-size:1.6rem;font-weight:800;color:rgba(255,255,255,0.9);
    }
    .ship-half:first-child .ship-half-placeholder{
      background:linear-gradient(160deg,#f472b6 0%,#e91e8c 100%);
    }
    .ship-half:last-child .ship-half-placeholder{
      background:linear-gradient(160deg,#ec4899 0%,#be185d 100%);
    }
    /* heart in center divider */
    .ship-divider{
      position:absolute;left:50%;top:38%;
      transform:translate(-50%,-50%);z-index:10;
      width:30px;height:30px;border-radius:50%;
      background:var(--primary);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;color:#fff;
      border:2.5px solid #fff;
      box-shadow:0 0 18px rgba(233,30,140,0.6),0 2px 8px rgba(0,0,0,0.2);
    }
    /* seam line */
    .ship-seam{
      position:absolute;left:50%;top:0;bottom:0;
      width:2px;background:rgba(255,255,255,0.25);
      transform:translateX(-50%);z-index:9;
    }

    /* combined (one photo) */
    .ship-combined{position:relative;height:100%;}
    .ship-combined img{width:100%;height:100%;object-fit:cover;display:block;}
    .ship-combined-placeholder{
      width:100%;height:100%;
      background:linear-gradient(160deg,#f9a8d4 0%,#e91e8c 50%,#be185d 100%);
      display:flex;align-items:center;justify-content:center;font-size:2.2rem;
    }

    /* info overlay */
    .ship-overlay{
      position:absolute;bottom:0;left:0;right:0;
      background:linear-gradient(to top,rgba(20,6,14,0.92) 0%,rgba(20,6,14,0.4) 60%,transparent 100%);
      padding:36px 10px 11px;
    }
    .ship-name{font-size:0.88rem;font-weight:700;color:#fff;line-height:1.2;}
    .ship-members-line{font-size:0.68rem;color:rgba(255,255,255,0.55);margin-top:2px;line-height:1.4;}
    .ship-hearts-line{font-size:0.75rem;color:var(--accent);margin-top:3px;}
    .ship-note-line{
      font-size:0.66rem;color:rgba(255,255,255,0.45);margin-top:2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    /* card delete button */
    .card-del{
      position:absolute;top:6px;right:6px;z-index:20;
      width:22px;height:22px;border-radius:50%;
      background:rgba(0,0,0,0.6);border:none;color:#fff;
      font-size:0.65rem;cursor:pointer;
      display:none;align-items:center;justify-content:center;
      transition:background var(--t);
    }
    .card-del:hover{background:var(--danger);}
    .edit-mode .card-del{display:flex;}

    /* add card */
    .add-card{
      aspect-ratio:3/4;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:8px;cursor:pointer;border:1.5px dashed var(--border);
      color:var(--text-faint);font-size:0.78rem;background:var(--surface);
      border-radius:var(--r-lg);
      transition:border-color var(--t),background var(--t),color var(--t);
    }
    .add-card:hover{border-color:var(--primary);background:var(--primary-dim);color:var(--primary);}
    .add-card-icon{font-size:1.8rem;}

    /* ===== UNLOCK MODAL ===== */
    .modal-backdrop{
      position:fixed;inset:0;z-index:2000;
      background:rgba(26,10,18,0.25);backdrop-filter:blur(4px);
      display:flex;align-items:center;justify-content:center;
      opacity:0;pointer-events:none;transition:opacity 180ms;
    }
    .modal-backdrop.open{opacity:1;pointer-events:auto;}
    .modal{
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:var(--r-xl);padding:28px;width:100%;max-width:340px;
      box-shadow:var(--shadow-lg);max-height:90dvh;overflow-y:auto;
      transform:scale(0.93);transition:transform 200ms cubic-bezier(0.16,1,0.3,1);
    }
    .modal-backdrop.open .modal{transform:scale(1);}
    .modal-title{
      font-family:var(--font-display);font-size:1.1rem;font-style:italic;
      color:var(--primary);margin-bottom:16px;text-align:center;
    }
    .field-label{
      font-size:0.7rem;font-weight:600;text-transform:uppercase;
      letter-spacing:0.09em;color:var(--text-faint);margin:12px 0 5px;
    }
    .field-row{display:flex;gap:8px;}
    .field-row .field-input{flex:1;min-width:0;}
    .field-input{
      width:100%;padding:8px 12px;
      background:var(--surface-2);border:1.5px solid var(--border);
      border-radius:var(--r-md);color:var(--text);font:inherit;
      font-size:0.86rem;outline:none;transition:border-color var(--t);
    }
    .field-input:focus{border-color:var(--primary);}
    .modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap;}
    .modal-error{font-size:0.78rem;color:var(--danger);margin-top:6px;min-height:1.2em;}

    /* hearts picker */
    .hearts-picker{display:flex;gap:8px;margin-top:6px;}
    .heart-opt{
      font-size:1.3rem;cursor:pointer;color:var(--border);
      transition:color var(--t),transform var(--t);
      background:none;border:none;padding:0;line-height:1;user-select:none;
    }
    .heart-opt.on{color:var(--primary);}
    .heart-opt:hover{transform:scale(1.25);}

    /* photo mode toggle */
    .photo-mode-row{display:flex;gap:6px;margin-top:6px;}
    .mode-btn{
      flex:1;padding:7px;border-radius:var(--r-md);
      border:1.5px solid var(--border);background:var(--surface-2);
      color:var(--text-muted);font:inherit;font-size:0.8rem;font-weight:500;
      cursor:pointer;transition:all var(--t);text-align:center;
    }
    .mode-btn.active{border-color:var(--primary);background:var(--primary-dim);color:var(--primary);}

    /* photo upload boxes */
    .photo-upload-wrap{margin-top:10px;}
    .photo-pair{display:flex;gap:8px;}
    .photo-slot{flex:1;cursor:pointer;}
    .photo-box{
      aspect-ratio:3/4;background:var(--surface-2);border:1.5px dashed var(--border);
      border-radius:var(--r-md);overflow:hidden;display:flex;
      align-items:center;justify-content:center;font-size:0.72rem;
      color:var(--text-faint);text-align:center;padding:8px;
      transition:border-color var(--t),background var(--t);
    }
    .photo-slot:hover .photo-box{border-color:var(--primary);background:var(--primary-dim);}
    .photo-box img{width:100%;height:100%;object-fit:cover;}
    .photo-slot-label{font-size:0.69rem;color:var(--text-faint);text-align:center;margin-top:4px;}

    /* unlock-specific */
    .unlock-input{
      width:100%;padding:10px 14px;margin-bottom:4px;
      background:var(--surface-2);border:1.5px solid var(--border);
      border-radius:var(--r-md);color:var(--text);font:inherit;
      font-size:0.9rem;text-align:center;outline:none;
      transition:border-color var(--t);
    }
    .unlock-input:focus{border-color:var(--primary);}
    .unlock-input::placeholder{color:var(--text-faint);}
    .btn-unlock{
      width:100%;padding:10px;border-radius:var(--r-md);border:none;
      background:var(--primary);color:#fff;font:inherit;
      font-size:0.9rem;font-weight:600;cursor:pointer;
      transition:background var(--t);margin-top:8px;
    }
    .btn-unlock:hover{background:#d0187c;}
    .btn-unlock:disabled{opacity:0.5;cursor:not-allowed;}
    .setup-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--divider);display:none;}
    .setup-section.open{display:block;}
    .setup-help{font-size:0.74rem;color:var(--text-faint);line-height:1.6;margin-bottom:10px;}
    .setup-help a{color:var(--primary);}
    .setup-input{
      width:100%;padding:8px 12px;margin-bottom:8px;
      background:var(--surface-2);border:1.5px solid var(--border);
      border-radius:var(--r-md);color:var(--text);font:inherit;
      font-size:0.82rem;outline:none;font-family:monospace;
      transition:border-color var(--t);
    }
    .setup-input:focus{border-color:var(--primary);}
    .btn-setup{
      width:100%;padding:8px;border-radius:var(--r-md);
      background:var(--primary-light);border:1.5px solid var(--border);
      color:var(--primary);font:inherit;font-size:0.84rem;font-weight:600;
      cursor:pointer;transition:background var(--t),border-color var(--t);
    }
    .btn-setup:hover{background:var(--primary-dim);border-color:var(--primary);}
    .setup-toggle{
      display:block;text-align:center;margin-top:12px;
      font-size:0.73rem;color:var(--text-faint);cursor:pointer;text-decoration:underline;
      background:none;border:none;width:100%;
    }
    .setup-toggle:hover{color:var(--primary);}

    /* ===== PROGRESS ===== */
    .progress-overlay{
      position:fixed;inset:0;z-index:4000;
      background:rgba(255,245,249,0.9);backdrop-filter:blur(6px);
      display:none;align-items:center;justify-content:center;
    }
    .progress-overlay.visible{display:flex;}
    .progress-card{
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:var(--r-xl);padding:32px 44px;text-align:center;
      box-shadow:var(--shadow-lg);min-width:240px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);
      border-top-color:var(--primary);animation:spin 0.8s linear infinite;margin:0 auto 14px;}
    .progress-status{font-size:0.85rem;color:var(--text-muted);}

    /* ===== TOAST ===== */
    .toast{
      position:fixed;bottom:20px;left:50%;
      transform:translateX(-50%) translateY(60px);
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:var(--r-md);padding:8px 18px;font-size:0.82rem;
      color:var(--text);z-index:9999;white-space:nowrap;box-shadow:var(--shadow);
      transition:transform 280ms cubic-bezier(0.16,1,0.3,1),opacity 280ms;
      opacity:0;pointer-events:none;
    }
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    .toast.ok{border-color:rgba(233,30,140,0.4);color:var(--primary);}
    .toast.err{border-color:rgba(229,53,53,0.4);color:var(--danger);}

    @media(max-width:600px){
      .ships-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
      .hero-title{font-size:2.2rem;}
      .app-header{padding:10px 16px;}
    }
  </style>
</head>
<body>

<!-- ===== PROGRESS ===== -->
<div class="progress-overlay" id="progressOverlay">
  <div class="progress-card">
    <div class="spinner"></div>
    <div class="progress-status" id="progressStatus">Working…</div>
  </div>
</div>

<!-- ===== UNLOCK MODAL ===== -->
<div class="modal-backdrop" id="unlockModal" onclick="if(event.target===this)closeUnlock()">
  <div class="modal">
    <div class="modal-title">🔒 edit mode</div>
    <input class="unlock-input" id="unlockPass" type="password"
      placeholder="password ♡" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')unlock()" />
    <div class="modal-error" id="unlockError"></div>
    <button class="btn-unlock" id="unlockBtn" onclick="unlock()">Unlock ♡</button>
    <button class="setup-toggle" onclick="toggleSetup()">first time setup</button>
    <div class="setup-section" id="setupSection">
      <div class="setup-help">
        Owner only — one time. Generate a
        <a href="https://github.com/settings/tokens?type=beta" target="_blank">fine-grained PAT</a>
        with <strong>Contents: Read &amp; Write</strong> on the coffeeonsugar repo.
      </div>
      <input class="setup-input" id="patInput" type="password" placeholder="github_pat_…" autocomplete="off" />
      <button class="btn-setup" onclick="setup()">Encrypt &amp; Save ♡</button>
    </div>
  </div>
</div>

<!-- ===== SHIP MODAL ===== -->
<div class="modal-backdrop" id="shipModal" onclick="if(event.target===this)closeShipModal()">
  <div class="modal">
    <div class="modal-title" id="shipModalTitle">New ship ♡</div>

    <div class="field-label">Ship name <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></div>
    <input class="field-input" id="smName" type="text" placeholder="e.g. TaeKook" />

    <div class="field-label">Member 1</div>
    <div class="field-row">
      <input class="field-input" id="smM1" type="text" placeholder="Name" />
      <input class="field-input" id="smG1" type="text" placeholder="Group" />
    </div>

    <div class="field-label">Member 2</div>
    <div class="field-row">
      <input class="field-input" id="smM2" type="text" placeholder="Name" />
      <input class="field-input" id="smG2" type="text" placeholder="Group" />
    </div>

    <div class="field-label">Hearts</div>
    <div class="hearts-picker" id="heartsPicker">
      <button class="heart-opt" data-v="1" onclick="setHearts(1)">♥</button>
      <button class="heart-opt" data-v="2" onclick="setHearts(2)">♥</button>
      <button class="heart-opt" data-v="3" onclick="setHearts(3)">♥</button>
      <button class="heart-opt" data-v="4" onclick="setHearts(4)">♥</button>
      <button class="heart-opt" data-v="5" onclick="setHearts(5)">♥</button>
    </div>

    <div class="field-label">Note <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></div>
    <input class="field-input" id="smNote" type="text" placeholder="why you ship them ♡" />

    <div class="field-label">Photos</div>
    <div class="photo-mode-row">
      <button class="mode-btn active" id="modeSplit"    onclick="setPhotoMode('split')">Split (2 photos)</button>
      <button class="mode-btn"        id="modeCombined" onclick="setPhotoMode('combined')">Combined</button>
    </div>
    <div class="photo-upload-wrap" id="photoUploadWrap"></div>

    <div class="modal-actions">
      <button class="btn btn-danger" id="smDeleteBtn" onclick="deleteShip()" style="margin-right:auto;display:none">Delete</button>
      <button class="btn" onclick="closeShipModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveShip()">Save ♡</button>
    </div>
  </div>
</div>

<!-- ===== HEADER ===== -->
<header class="app-header">
  <div class="header-brand">💗 ships</div>
  <div class="header-actions">
    <a href="../kpop.html" class="btn" style="font-size:0.78rem">← K-pop</a>
    <a href="xoxo.html"   class="btn" style="font-size:0.78rem">xoxo</a>
    <button class="btn-icon active" id="editToggle" onclick="toggleEdit()" style="display:none" title="Edit mode">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
    <button class="btn btn-primary" id="saveBtn" onclick="saveToGitHub()" style="display:none">Save ♡</button>
    <button class="btn-icon" id="lockBtn" onclick="openUnlock()" title="Edit">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </button>
  </div>
</header>

<!-- ===== PAGE ===== -->
<div class="page">
  <div class="hero">
    <div class="hero-title">ships ♡</div>
    <div class="hero-sub">the ones that just make sense</div>
  </div>
  <div class="section-header">
    <div class="section-title">all ships</div>
  </div>
  <div class="ships-grid" id="shipsGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const GH_OWNER  = 'Pedestre-commits';
const GH_REPO   = 'coffeeonsugar';
const GH_BRANCH = 'main';
const REPO_BASE = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`;
const DATA_PATH = 'data/ships.json';
const ENC_KEY   = 'xoxo_enc_pat';  // shared with xoxo page

// ===== STATE =====
let DATA         = { ships: [] };
let editMode     = false;
let unlocked     = false;
let pendingFiles = {};   // path → File, committed on Save
let editingIdx   = -1;
let heartsVal    = 3;
let photoMode    = 'split';
let pendingP     = { p1: null, p2: null, combined: null };  // modal staging

const _urlCache = new Map();
function cachedURL(file) {
  if (!_urlCache.has(file)) _urlCache.set(file, URL.createObjectURL(file));
  return _urlCache.get(file);
}

// ===== DATA LOAD =====
async function loadData() {
  try {
    const res = await fetch('../data/ships.json', { cache: 'no-cache' });
    if (res.ok) { DATA = await res.json(); if (!DATA.ships) DATA.ships = []; }
  } catch {}
  render();
}

// ===== CRYPTO (same as xoxo) =====
async function deriveKey(password, salt) {
  const km = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encryptPAT(pat, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(pass, salt);
  const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(pat));
  const out  = new Uint8Array(28 + ct.byteLength);
  out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(ct), 28);
  return btoa(String.fromCharCode(...out));
}
async function decryptPAT(enc, pass) {
  const buf = Uint8Array.from(atob(enc), c => c.charCodeAt(0));
  const key = await deriveKey(pass, buf.slice(0, 16));
  const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
  return new TextDecoder().decode(dec);
}

// ===== UNLOCK =====
function openUnlock() {
  if (unlocked) { toggleEdit(); return; }
  document.getElementById('unlockPass').value = '';
  document.getElementById('unlockError').textContent = '';
  document.getElementById('setupSection').classList.remove('open');
  document.getElementById('unlockModal').classList.add('open');
  setTimeout(() => document.getElementById('unlockPass').focus(), 60);
}
function closeUnlock() { document.getElementById('unlockModal').classList.remove('open'); }
function toggleSetup() { document.getElementById('setupSection').classList.toggle('open'); }

async function setup() {
  const pat  = document.getElementById('patInput').value.trim();
  const pass = document.getElementById('unlockPass').value.trim();
  if (!pat || !pass) { setUnlockError('Enter both a password and a PAT.'); return; }
  try { localStorage.setItem(ENC_KEY, await encryptPAT(pat, pass)); await activateEdit(pat); }
  catch (e) { setUnlockError('Setup failed: ' + e.message); }
}
async function unlock() {
  const pass = document.getElementById('unlockPass').value.trim();
  if (!pass) return;
  const btn = document.getElementById('unlockBtn');
  btn.disabled = true; btn.textContent = '…';
  setUnlockError('');
  const enc = localStorage.getItem(ENC_KEY);
  if (!enc) { setUnlockError('Not set up — use "first time setup" below.'); btn.disabled = false; btn.textContent = 'Unlock ♡'; return; }
  try { await activateEdit(await decryptPAT(enc, pass)); }
  catch  { setUnlockError('Wrong password ♡'); }
  btn.disabled = false; btn.textContent = 'Unlock ♡';
}
async function activateEdit(pat) {
  sessionStorage.setItem('xoxo_pat', pat);
  unlocked = true;
  closeUnlock();
  document.getElementById('lockBtn').style.display    = 'none';
  document.getElementById('editToggle').style.display = '';
  enableEditMode();
}
function setUnlockError(msg) { document.getElementById('unlockError').textContent = msg; }

// ===== GITHUB API =====
function pat() { return sessionStorage.getItem('xoxo_pat'); }
async function ghCall(url, method = 'GET', body = null) {
  const res = await fetch(url.startsWith('http') ? url : REPO_BASE + url, {
    method,
    headers: {
      'Authorization': `Bearer ${pat()}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(body ? { 'Content-Type': 'application/json' } : {})
    },
    ...(body ? { body: JSON.stringify(body) } : {})
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.message || `HTTP ${res.status}`); }
  return res.json();
}

async function saveToGitHub() {
  setProgress(true, 'Getting repo state…');
  try {
    const ref     = await ghCall(`/git/refs/heads/${GH_BRANCH}`);
    const headSha = ref.object.sha;
    const treeSha = (await ghCall(`/git/commits/${headSha}`)).tree.sha;
    const entries = [];
    const files   = Object.entries(pendingFiles);

    setProgress(true, 'Uploading data…');
    const jBlob = await ghCall('/git/blobs', 'POST', {
      content: btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2)))),
      encoding: 'base64'
    });
    entries.push({ path: DATA_PATH, mode: '100644', type: 'blob', sha: jBlob.sha });

    for (let i = 0; i < files.length; i++) {
      const [path, file] = files[i];
      setProgress(true, `Uploading photo ${i + 1}/${files.length}…`);
      const blob = await ghCall('/git/blobs', 'POST', { content: await fileToBase64(file), encoding: 'base64' });
      entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
    }

    setProgress(true, 'Committing…');
    const tree   = await ghCall('/git/trees', 'POST', { base_tree: treeSha, tree: entries });
    const commit = await ghCall('/git/commits', 'POST', {
      message: `Update ships — ${DATA.ships.length} ship${DATA.ships.length !== 1 ? 's' : ''}`,
      tree: tree.sha, parents: [headSha]
    });
    await ghCall(`/git/refs/heads/${GH_BRANCH}`, 'PATCH', { sha: commit.sha });
    pendingFiles = {};
    showToast('Saved! Live in ~60s ✓', 'ok');
    document.getElementById('saveBtn').style.display = 'none';
  } catch (e) { showToast('Save failed: ' + e.message, 'err'); }
  finally { setProgress(false); }
}

// ===== RENDER =====
function render() { renderShips(); }

function photoSrc(path) {
  if (!path) return '';
  return pendingFiles[path] ? cachedURL(pendingFiles[path]) : ('../' + path);
}
function initials(name) { return (name || '?')[0].toUpperCase(); }

function renderCard(s, i) {
  const mode   = s.photo_mode || 'split';
  const label  = s.name || `${s.member1} × ${s.member2}`;
  const sub    = s.name
    ? `${s.member1}${s.group1 ? ' ('+s.group1+')' : ''} × ${s.member2}${s.group2 ? ' ('+s.group2+')' : ''}`
    : `${s.group1 || ''}${s.group1 && s.group2 ? ' × ' : ''}${s.group2 || ''}`;
  const hearts = '♥'.repeat(s.hearts || 0);

  let visual;
  if (mode === 'combined') {
    const src = photoSrc(s.photo);
    visual = `<div class="ship-combined">
      ${src ? `<img src="${src}" alt="${label}" loading="lazy">`
             : `<div class="ship-combined-placeholder">💗</div>`}
    </div>`;
  } else {
    const s1 = photoSrc(s.photo1), s2 = photoSrc(s.photo2);
    visual = `<div class="ship-split">
      <div class="ship-half">
        ${s1 ? `<img src="${s1}" alt="${s.member1}" loading="lazy">`
              : `<div class="ship-half-placeholder">${initials(s.member1)}</div>`}
      </div>
      <div class="ship-half">
        ${s2 ? `<img src="${s2}" alt="${s.member2}" loading="lazy">`
              : `<div class="ship-half-placeholder">${initials(s.member2)}</div>`}
      </div>
      <div class="ship-seam"></div>
      <div class="ship-divider">♥</div>
    </div>`;
  }

  const onclick = editMode ? `onclick="openShipModal(${i})"` : '';
  return `<div class="ship-card" ${onclick}>
    ${visual}
    <div class="ship-overlay">
      <div class="ship-name">${label}</div>
      ${sub ? `<div class="ship-members-line">${sub}</div>` : ''}
      ${hearts ? `<div class="ship-hearts-line">${hearts}</div>` : ''}
      ${s.note ? `<div class="ship-note-line">${s.note}</div>` : ''}
    </div>
    <button class="card-del" onclick="event.stopPropagation();removeShip(${i})" title="Remove">✕</button>
  </div>`;
}

function renderShips() {
  const cards  = (DATA.ships || []).map((s, i) => renderCard(s, i)).join('');
  const addBtn = editMode
    ? `<div class="add-card" onclick="openShipModal(-1)"><div class="add-card-icon">💗</div><span>Add ship</span></div>`
    : '';
  document.getElementById('shipsGrid').innerHTML = cards + addBtn;
}

// ===== EDIT MODE =====
function enableEditMode() {
  editMode = true;
  document.getElementById('editToggle').classList.add('active');
  document.body.classList.add('edit-mode');
  renderShips();
}
function toggleEdit() {
  editMode = !editMode;
  document.getElementById('editToggle').classList.toggle('active', editMode);
  document.body.classList.toggle('edit-mode', editMode);
  renderShips();
}
function markDirty() { document.getElementById('saveBtn').style.display = ''; }

// ===== SHIP MODAL =====
function openShipModal(idx) {
  editingIdx = idx;
  const s = idx === -1 ? {} : (DATA.ships[idx] || {});
  document.getElementById('shipModalTitle').textContent = idx === -1 ? 'New ship ♡' : 'Edit ship ♡';
  document.getElementById('smName').value = s.name    || '';
  document.getElementById('smM1').value   = s.member1 || '';
  document.getElementById('smG1').value   = s.group1  || '';
  document.getElementById('smM2').value   = s.member2 || '';
  document.getElementById('smG2').value   = s.group2  || '';
  document.getElementById('smNote').value = s.note    || '';
  document.getElementById('smDeleteBtn').style.display = idx === -1 ? 'none' : '';
  heartsVal  = s.hearts     || 3;
  photoMode  = s.photo_mode || 'split';
  pendingP   = { p1: null, p2: null, combined: null };
  updateHeartsUI();
  updatePhotoModeUI();
  renderPhotoInputs(s);
  document.getElementById('shipModal').classList.add('open');
  setTimeout(() => document.getElementById('smM1').focus(), 50);
}
function closeShipModal() { document.getElementById('shipModal').classList.remove('open'); }

function setHearts(v) { heartsVal = v; updateHeartsUI(); }
function updateHeartsUI() {
  document.querySelectorAll('.heart-opt').forEach(b =>
    b.classList.toggle('on', parseInt(b.dataset.v) <= heartsVal)
  );
}
function setPhotoMode(m) {
  photoMode = m; updatePhotoModeUI();
  const s = editingIdx >= 0 ? (DATA.ships[editingIdx] || {}) : {};
  renderPhotoInputs(s);
}
function updatePhotoModeUI() {
  document.getElementById('modeSplit').classList.toggle('active', photoMode === 'split');
  document.getElementById('modeCombined').classList.toggle('active', photoMode === 'combined');
}

function renderPhotoInputs(s = {}) {
  const wrap = document.getElementById('photoUploadWrap');
  if (photoMode === 'combined') {
    const src = pendingP.combined ? cachedURL(pendingP.combined) : photoSrc(s.photo || '');
    wrap.innerHTML = `
      <label class="photo-slot" style="max-width:130px;margin:0 auto;display:block">
        <input type="file" accept="image/*" hidden onchange="onPhotoFile(this.files[0],'combined')" />
        <div class="photo-box">${src ? `<img src="${src}">` : 'click to choose'}</div>
        <div class="photo-slot-label">Combined photo</div>
      </label>`;
  } else {
    const src1 = pendingP.p1 ? cachedURL(pendingP.p1) : photoSrc(s.photo1 || '');
    const src2 = pendingP.p2 ? cachedURL(pendingP.p2) : photoSrc(s.photo2 || '');
    wrap.innerHTML = `
      <div class="photo-pair">
        <label class="photo-slot">
          <input type="file" accept="image/*" hidden onchange="onPhotoFile(this.files[0],'p1')" />
          <div class="photo-box">${src1 ? `<img src="${src1}">` : 'click to choose'}</div>
          <div class="photo-slot-label">Member 1</div>
        </label>
        <label class="photo-slot">
          <input type="file" accept="image/*" hidden onchange="onPhotoFile(this.files[0],'p2')" />
          <div class="photo-box">${src2 ? `<img src="${src2}">` : 'click to choose'}</div>
          <div class="photo-slot-label">Member 2</div>
        </label>
      </div>`;
  }
}

function onPhotoFile(file, slot) {
  if (!file) return;
  pendingP[slot] = file;
  _urlCache.set(file, URL.createObjectURL(file));
  const s = editingIdx >= 0 ? (DATA.ships[editingIdx] || {}) : {};
  renderPhotoInputs(s);
}

// monotonically-increasing filename counter across all committed + pending photos
function nextPhotoPath(suffix, ext) {
  const committed = (DATA.ships || [])
    .flatMap(s => [s.photo, s.photo1, s.photo2].filter(Boolean)).length;
  const pending   = Object.keys(pendingFiles).length;
  const n = committed + pending + 1;
  return `photos/ships/${n}${suffix}.${ext}`;
}

function saveShip() {
  const m1 = document.getElementById('smM1').value.trim();
  const m2 = document.getElementById('smM2').value.trim();
  if (!m1 || !m2) { showToast('Both members are required', 'err'); return; }

  const prev = editingIdx >= 0 ? DATA.ships[editingIdx] : {};
  const ship = {
    name:       document.getElementById('smName').value.trim(),
    member1:    m1,
    group1:     document.getElementById('smG1').value.trim(),
    member2:    m2,
    group2:     document.getElementById('smG2').value.trim(),
    note:       document.getElementById('smNote').value.trim(),
    hearts:     heartsVal,
    photo_mode: photoMode,
    photo:      prev.photo  || '',
    photo1:     prev.photo1 || '',
    photo2:     prev.photo2 || '',
  };

  if (photoMode === 'combined') {
    if (pendingP.combined) {
      const path = nextPhotoPath('', pendingP.combined.name.split('.').pop().toLowerCase());
      pendingFiles[path] = pendingP.combined;
      ship.photo = path;
    }
    ship.photo1 = ''; ship.photo2 = '';
  } else {
    if (pendingP.p1) {
      const path = nextPhotoPath('a', pendingP.p1.name.split('.').pop().toLowerCase());
      pendingFiles[path] = pendingP.p1;
      ship.photo1 = path;
    }
    if (pendingP.p2) {
      const path = nextPhotoPath('b', pendingP.p2.name.split('.').pop().toLowerCase());
      pendingFiles[path] = pendingP.p2;
      ship.photo2 = path;
    }
    ship.photo = '';
  }

  if (editingIdx === -1) DATA.ships.push(ship);
  else DATA.ships[editingIdx] = ship;

  closeShipModal();
  renderShips();
  markDirty();
}

function removeShip(i) {
  const s = DATA.ships[i];
  [s.photo, s.photo1, s.photo2].filter(Boolean).forEach(p => { if (pendingFiles[p]) delete pendingFiles[p]; });
  DATA.ships.splice(i, 1);
  renderShips();
  markDirty();
}

function deleteShip() {
  if (editingIdx < 0) return;
  removeShip(editingIdx);
  closeShipModal();
}

// ===== UTILS =====
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function setProgress(v, msg = '') {
  document.getElementById('progressOverlay').classList.toggle('visible', v);
  if (msg) document.getElementById('progressStatus').textContent = msg;
}
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeUnlock(); closeShipModal(); }
  });
  const saved = sessionStorage.getItem('xoxo_pat');
  if (saved) {
    unlocked = true;
    document.getElementById('lockBtn').style.display    = 'none';
    document.getElementById('editToggle').style.display = '';
  }
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coffeeonsugar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>☕</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080d16;
      --surface: #0f1824;
      --surface-2: #151e2d;
      --border: rgba(255,255,255,0.07);
      --text: #eef0f6;
      --text-muted: #5e6d85;

      --travel: #2dd4bf;
      --travel-glow: rgba(45,212,191,0.18);
      --kpop: #c084fc;
      --kpop-glow: rgba(192,132,252,0.18);
      --print: #38bdf8;
      --print-glow: rgba(56,189,248,0.18);
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 55% 45% at 85% 5%,  rgba(192,132,252,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 5%  70%,  rgba(45,212,191,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 35% at 50% 95%,  rgba(56,189,248,0.08) 0%, transparent 70%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      gap: 3rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
    }

    .brand {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #f0f0f8 20%, #8899b4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.6rem;
    }

    /* ── Cards grid ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      width: 100%;
      max-width: 860px;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 1.75rem 2rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      overflow: hidden;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.22s ease;
      border-radius: inherit;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card--travel:hover {
      border-color: var(--travel);
      box-shadow: 0 10px 40px var(--travel-glow), 0 0 0 1px var(--travel);
    }
    .card--travel::before {
      background: radial-gradient(ellipse 80% 60% at 50% 120%, var(--travel-glow), transparent);
    }

    .card--kpop:hover {
      border-color: var(--kpop);
      box-shadow: 0 10px 40px var(--kpop-glow), 0 0 0 1px var(--kpop);
    }
    .card--kpop::before {
      background: radial-gradient(ellipse 80% 60% at 50% 120%, var(--kpop-glow), transparent);
    }

    .card--print:hover {
      border-color: var(--print);
      box-shadow: 0 10px 40px var(--print-glow), 0 0 0 1px var(--print);
    }
    .card--print::before {
      background: radial-gradient(ellipse 80% 60% at 50% 120%, var(--print-glow), transparent);
    }

    .card-icon {
      font-size: 2.6rem;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .card-sub {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-align: center;
      line-height: 1.4;
    }

    .card-arrow {
      margin-top: 1rem;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .card:hover .card-arrow {
      opacity: 1;
      transform: translateY(0);
    }

    .card--travel:hover .card-arrow  { color: var(--travel); }
    .card--kpop:hover   .card-arrow  { color: var(--kpop); }
    .card--print:hover  .card-arrow  { color: var(--print); }

    /* ── Footer ── */
    footer {
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      body { gap: 2rem; justify-content: flex-start; padding-top: 3rem; }
      .cards { grid-template-columns: 1fr; max-width: 380px; }
      .card { padding: 1.75rem 1.5rem 1.5rem; }
    }

    @media (min-width: 641px) and (max-width: 820px) {
      .cards { grid-template-columns: repeat(3, 1fr); gap: 0.85rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">coffeeonsugar</div>
    <p class="tagline">Bruno's corner of the internet</p>
  </header>

  <nav class="cards">

    <a href="travel.html" class="card card--travel">
      <div class="card-icon">✈️</div>
      <div class="card-title">Travel</div>
      <div class="card-sub">Where I've been</div>
      <div class="card-arrow">Explore →</div>
    </a>

    <a href="kpop.html" class="card card--kpop">
      <div class="card-icon">🎤</div>
      <div class="card-title">K-pop</div>
      <div class="card-sub">Every concert, every memory</div>
      <div class="card-arrow">Open →</div>
    </a>

    <a href="soon.html" class="card card--print">
      <div class="card-icon">⚙️</div>
      <div class="card-title">Workshop</div>
      <div class="card-sub">3D prints &amp; builds</div>
      <div class="card-arrow">Coming soon →</div>
    </a>

  </nav>

  <footer>coffeeonsugar.online</footer>

</body>
</html>

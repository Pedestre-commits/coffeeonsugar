<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruno's Workshop — coffeeonsugar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b1220;
      --text: #f0f0f8;
      --text-muted: #7f93b0;
      --accent: #38bdf8;
      --accent2: #6366f1;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(99,102,241,0.22) 0%, transparent 70%),
        radial-gradient(ellipse 50% 45% at 10% 60%, rgba(14,165,233,0.16) 0%, transparent 70%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .back-link {
      position: fixed;
      top: 24px;
      left: 24px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
      z-index: 10;
    }
    .back-link:hover { color: var(--text); }

    /* ── Gears ── */
    svg.gears {
      display: block;
      margin: 0 auto 48px;
      overflow: visible;
    }

    .gear-large {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin-cw 9s linear infinite;
    }
    .gear-small {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin-ccw 6s linear infinite;
    }

    @keyframes spin-cw  { to { transform: rotate(360deg); } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }

    .gear-face   { fill: #2d4060; stroke: rgba(56,189,248,0.35); stroke-width: 1.5; }
    .gear-spoke  { stroke: #3d5880; stroke-width: 2; stroke-linecap: round; }
    .gear-axle   { fill: #0b1220; stroke: rgba(56,189,248,0.5); stroke-width: 1.5; }

    /* ── Text ── */
    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .title {
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #e0f2fe 0%, var(--accent) 55%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .sub {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 44px;
    }

    /* ── Progress ── */
    .progress-wrap { width: min(280px, 90vw); margin: 0 auto; }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 2px;
      animation: fill 10s ease-out forwards;
    }

    @keyframes fill {
      0%   { width: 0%; }
      65%  { width: 69%; }
      80%  { width: 70%; }
      100% { width: 70%; }
    }

    .hint {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 10px;
      font-style: italic;
      opacity: 0;
      animation: fadein 1s 11s forwards;
    }

    @keyframes fadein { to { opacity: 0.6; } }
  </style>
</head>
<body>

  <a href="/" class="back-link">← coffeeonsugar</a>

  <svg class="gears" id="g" width="220" height="130" viewBox="0 0 220 130"></svg>

  <p class="eyebrow">Bruno's</p>
  <h1 class="title">Workshop</h1>
  <p class="sub">Something is being made.<br>You'll see it when it's ready.</p>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Work in progress</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <p class="hint">eta: classified</p>
  </div>

  <script>
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('g');

    function f(n) { return n.toFixed(2); }

    /* Generate a gear path with evenodd hub hole */
    function gearPath(cx, cy, R, r, N, hubR) {
      const step = (2 * Math.PI) / N;
      const frac = 0.42;
      let d = '';

      for (let i = 0; i < N; i++) {
        const a0 = i * step - Math.PI / 2;
        const a1 = a0 + step * (1 - frac) / 2;
        const a2 = a1 + step * frac;
        if (i === 0) d += `M ${f(cx + r * Math.cos(a0))},${f(cy + r * Math.sin(a0))}`;
        d += ` A ${r},${r} 0 0,1 ${f(cx + r * Math.cos(a1))},${f(cy + r * Math.sin(a1))}`;
        d += ` L ${f(cx + R * Math.cos(a1))},${f(cy + R * Math.sin(a1))}`;
        d += ` A ${R},${R} 0 0,1 ${f(cx + R * Math.cos(a2))},${f(cy + R * Math.sin(a2))}`;
        d += ` L ${f(cx + r * Math.cos(a2))},${f(cy + r * Math.sin(a2))}`;
      }
      d += ' Z';
      /* Hub hole — opposite winding (CW) so evenodd punches it out */
      d += ` M ${f(cx + hubR)},${f(cy)} A ${hubR},${hubR} 0 1,0 ${f(cx - hubR)},${f(cy)} A ${hubR},${hubR} 0 1,0 ${f(cx + hubR)},${f(cy)} Z`;
      return d;
    }

    function addSpokes(parent, cx, cy, hubR, bodyR, count) {
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        const ln = document.createElementNS(ns, 'line');
        ln.setAttribute('x1', f(cx + hubR * Math.cos(a)));
        ln.setAttribute('y1', f(cy + hubR * Math.sin(a)));
        ln.setAttribute('x2', f(cx + bodyR * Math.cos(a)));
        ln.setAttribute('y2', f(cy + bodyR * Math.sin(a)));
        ln.setAttribute('class', 'gear-spoke');
        parent.appendChild(ln);
      }
    }

    function makeGear(cx, cy, R, r, N, hubR, spokeR, spokes, cls) {
      const g = document.createElementNS(ns, 'g');
      g.setAttribute('class', cls);

      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', gearPath(cx, cy, R, r, N, hubR));
      path.setAttribute('fill-rule', 'evenodd');
      path.setAttribute('class', 'gear-face');
      g.appendChild(path);

      addSpokes(g, cx, cy, hubR, spokeR, spokes);

      const axle = document.createElementNS(ns, 'circle');
      axle.setAttribute('cx', cx);
      axle.setAttribute('cy', cy);
      axle.setAttribute('r', hubR);
      axle.setAttribute('class', 'gear-axle');
      g.appendChild(axle);

      svg.appendChild(g);
    }

    /* Large gear: 12 teeth, cx=80 cy=65 */
    makeGear(80, 65, 52, 40, 12, 11, 36, 4, 'gear-large');
    /* Small gear: 8 teeth, cx=162 cy=65 — teeth just interlocking */
    makeGear(162, 65, 34, 26, 8,  8, 19, 3, 'gear-small');

    /* Percent counter */
    const pctEl = document.getElementById('pct');
    const target = 70, dur = 10000, t0 = performance.now();
    (function tick(now) {
      const p = Math.min((now - t0) / dur, 1);
      const e = 1 - Math.pow(1 - p, 3);
      pctEl.textContent = Math.round(e * target) + '%';
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  </script>
</body>
</html>
